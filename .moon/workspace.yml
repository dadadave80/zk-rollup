# Configures all projects within the workspace to create a project graph.
# Accepts a list of globs, a mapping of projects to relative file paths,
# or both values.

$schema: 'https://moonrepo.dev/schemas/workspace.json'

projects:
  globs:
    - 'crates/*'
    - 'apps/*'
    - 'packages/*'
    - 'contracts'
  sources:
    contracts: 'contracts'

vcs:
  client: 'git'
  hooks:
  sync: true
  # The default branch / base.
  defaultBranch: "main"

  # The upstream version control provider, where the repository
  # source code is stored.
  # @since 1.8.0
  # @values "bitbucket" | "github" | "gitlab" | "other"
  provider: "github"

runner:
  archivableTargets:
    - ':build'
    - ':lint'
    - ':test'
    - ':typecheck'
  cacheLifetime: '7 days'

docker:
  scaffold:
    include:
      - '*.toml'
      - '*.lock'
      - 'rust-toolchain.toml'
      - 'foundry.toml'
      - 'remappings.txt'

experiments:
  interweavedTaskInheritance: true